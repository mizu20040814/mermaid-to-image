<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mermaid to Image</title>
  </head>
  <body>
    <header class="app-header">
      <h1>Mermaid to Image</h1>
      <div class="actions">
        <button id="download-png" type="button">PNG をダウンロード</button>
        <button id="download-svg" type="button">SVG をダウンロード</button>
      </div>
    </header>
    <main class="app-main">
      <section class="pane">
        <label for="editor">Mermaid コード</label>
        <textarea id="editor" spellcheck="false"></textarea>
      </section>
      <section class="pane">
        <h2>プレビュー</h2>
        <div id="error" role="alert"></div>
        <div id="preview"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
